<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Child Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Child Selector (>)</h1>
    <p>Selects ONLY direct children, not nested deep. Syntax: <code>div > p { }</code></p>

    <div class="parent">
        <p>Direct child p - Selected by div > p</p>
        <section>
            <p>Nested deep p inside section - NOT Selected by > (only descendant can select)</p>
        </section>
    </div>
</body>
</html>
