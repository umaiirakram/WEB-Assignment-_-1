<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - ID Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ID Selector (#)</h1>
    <p>Selects single unique element with specific ID. ID must be unique. Syntax: <code>#idname { }</code> - Higher specificity than class.</p>
    
    <div id="header">Div with id="header" - Unique header style</div>
    <div id="main">Div with id="main" - Unique main style</div>
    <div id="footer">Div with id="footer" - Unique footer style</div>
    <div>Normal div without ID</div>
</body>
</html>
