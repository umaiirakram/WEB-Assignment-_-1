<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Class Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Class Selector (.)</h1>
    <p>Selects elements with specific class. Can be reused on multiple elements. Syntax: <code>.classname { }</code></p>
    
    <div class="box">Box 1 - class="box"</div>
    <div class="box highlight">Box 2 - class="box highlight" (two classes)</div>
    <p class="box">Paragraph with class="box" - same style applies</p>
    <div>Normal div without class</div>
</body>
</html>
