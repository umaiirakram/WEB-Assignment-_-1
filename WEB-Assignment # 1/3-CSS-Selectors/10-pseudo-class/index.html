<body>
    <h1>Pseudo-class (:)</h1>
    <p>Selects elements in a specific STATE. Syntax: <code>:hover</code>, <code>:nth-child()</code>, <code>:first-child</code></p>

    <a href="#">Hover over me - :hover</a>
    <input type="text" placeholder="Focus on me - :focus">

    <ul>
        <li>Item 1 - :first-child</li>
        <li>Item 2 - :nth-child(2)</li>
        <li>Item 3</li>
        <li>Item 4 - :last-child & :nth-child(even)</li>
    </ul>
</body>
