<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Attribute Selector [attribute]</h1>
    <p>Selects elements based on attribute or attribute value. Syntax: <code>[type="text"]</code>, <code>[href^="https"]</code></p>

    <input type="text" placeholder="type=text selector">
    <input type="password" placeholder="type=password selector">
    <input type="email" placeholder="type=email selector">

    <a href="https://google.com">External Link https</a>
    <a href="/internal-page">Internal Link /</a>
    <a href="document.pdf">PDF File</a>
</body>
