<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Element Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Element Selector</h1>
    <p>Selects all elements with same tag name. Syntax: <code>p { }</code>, <code>h1 { }</code></p>
    
    <p>This is paragraph 1 - will be styled</p>
    <p>This is paragraph 2 - will be styled</p>
    <h2>This is H2 - will be styled</h2>
    <div>This is div - will be styled</div>
    <div>This is another div</div>
</body>
</html>
