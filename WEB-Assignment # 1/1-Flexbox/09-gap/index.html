<body>
    <h1>gap Property</h1>
    <p>Controls space <strong>between</strong> flex items, not outer edges. Better than margin.</p>
    <p>Also use <code>row-gap</code> and <code>column-gap</code></p>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
