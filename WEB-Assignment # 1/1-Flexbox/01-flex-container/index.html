<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Flex Container</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flex Container</h1>
    <p><strong>Definition:</strong> Parent element with <code>display:flex</code> becomes a flex container. It controls layout of its direct children.</p>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
    <p>Note: Without display:flex, boxes are block (vertical). With flex, they are in a row.</p>
</body>
</html>
