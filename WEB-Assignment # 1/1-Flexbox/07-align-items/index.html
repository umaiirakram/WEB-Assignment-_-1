<body>
    <h1>align-items</h1>
    <p>Aligns on <strong>Cross Axis</strong>. In row layout, aligns vertically.</p>
    <p>Perfect centering: <code>justify-content:center + align-items:center + height</code></p>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box tall">Box 2 Tall</div>
        <div class="box">Box 3</div>
    </div>
</body>
