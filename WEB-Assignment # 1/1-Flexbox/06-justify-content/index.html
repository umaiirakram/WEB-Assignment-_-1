<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 - justify-content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>justify-content</h1>
    <p>Aligns items on <strong>Main Axis</strong>. Values: flex-start, center, flex-end, space-between, space-around, space-evenly</p>
    <p><strong>Practical:</strong> Logo left, links right using space-between</p>
    <div class="container">
        <div class="box logo">LOGO</div>
        <div class="nav-group">
            <div class="box small">Home</div>
            <div class="box small">About</div>
            <div class="box small">Contact</div>
        </div>
    </div>
</body>
</html>
