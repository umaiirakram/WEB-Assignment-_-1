<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - flex-direction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>flex-direction</h1>
    <p>Property that sets Main Axis direction: <code>row | row-reverse | column | column-reverse</code></p>
    <h3>Current: column (Main axis is vertical)</h3>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
    <p>Change CSS to <code>flex-direction: row-reverse</code> to reverse order.</p>
</body>
</html>
