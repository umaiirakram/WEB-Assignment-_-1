<body>
    <h1>Cross Axis</h1>
    <p><strong>Cross Axis</strong> is perpendicular to Main Axis. Default vertical.</p>
    <p><strong>Important:</strong> <code>justify-content</code> = Main Axis, <code>align-items</code> = Cross Axis</p>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
