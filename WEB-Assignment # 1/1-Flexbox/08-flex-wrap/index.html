<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08 - flex-wrap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>flex-wrap</h1>
    <p>Default <code>nowrap</code> shrinks items on one line. <code>wrap</code> moves to next line.</p>
    <p>Container width 550px, each box 120px = 4 per row, rest drops to next line.</p>
    <div class="container">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div><div class="box">4</div>
        <div class="box">5</div><div class="box">6</div><div class="box">7</div><div class="box">8</div>
    </div>
</body>
</html>
