<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - position fixed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Positioning - fixed</h1>
    <p>Removed from flow, always positioned <strong>relative to viewport</strong>. Stays at same place even when scrolling. Used for headers, chat buttons.</p>

    <div class="fixed-box">Fixed Box - top:10px; right:10px;</div>
    
    <div class="content">
        <p>Scroll down to see fixed effect...</p>
        <div class="tall">Tall content 1000px - Lorem ipsum... Scroll test</div>
        <div class="tall">Keep scrolling...</div>
    </div>
</body>
</html>
