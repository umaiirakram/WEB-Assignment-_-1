<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - position relative</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Positioning - relative</h1>
    <p>Moves element <strong>relative to its normal position</strong>. Original space is still reserved. top, left, right, bottom work.</p>
    
    <div class="container">
        <div class="box">Box 1 - Normal</div>
        <div class="box relative">Box 2 - relative; top:20px; left:30px;</div>
        <div class="box">Box 3 - Normal (space of box 2 is still reserved)</div>
    </div>
</body>
</html>
